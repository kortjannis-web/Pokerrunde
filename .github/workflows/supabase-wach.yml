# Haelt das kostenlose Supabase-Projekt wach (Free-Projekte werden nach 7 Tagen ohne Nutzung pausiert).
# Liest Project URL und Publishable key aus index.html; solange die leer sind, passiert nichts.
name: Supabase wach halten
on:
  schedule:
    - cron: '23 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bei Supabase anklopfen
        run: |
          URL=$(sed -n "s/^var SUPABASE_URL = '\([^']*\)'.*/\1/p" index.html | head -1)
          KEY=$(sed -n "s/^var SUPABASE_KEY = '\([^']*\)'.*/\1/p" index.html | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase ist noch nicht eingetragen, nichts zu tun."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/name_free" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"n":"wach"}'
          echo
          echo "Supabase ist wach."
